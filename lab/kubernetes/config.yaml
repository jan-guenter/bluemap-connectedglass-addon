apiVersion: v1
kind: ConfigMap
metadata:
  name: bluemap-connectedglass-staging-config
  namespace: bluemap-sophisticated-staging
  labels:
    app.kubernetes.io/part-of: bluemap-sophisticated-staging
    app.kubernetes.io/component: connected-glass
data:
  core.conf: |
    accept-download: true
    data: "bluemap"
    render-thread-count: 2
    update-cooldown: 60
    full-update-interval: 0
    scan-for-mod-resources: true
    metrics: false
    log: {
      file: "bluemap/logs/debug.log"
      append: false
    }
  webserver.conf: |
    enabled: true
    webroot: "bluemap/web"
    port: 8100
    log: {
      file: "bluemap/logs/webserver.log"
      append: false
      format: "%1$s \"%3$s %4$s %5$s\" %6$s %7$s"
    }
  file.conf: |
    storage-type: file
    root: "bluemap/web/maps"
    compression: gzip
  connectedglass_staging.conf: |
    world: "world"
    dimension: "minecraft:overworld"
    name: "Connected Glass review"
    start-pos: { x: 220, z: 216 }
    render-mask: [
      {
        min-x: 188
        max-x: 252
        min-z: 200
        max-z: 232
        min-y: 99
        max-y: 108
      }
    ]
    storage: "file"
