apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: bluemap-sophisticated-staging
spec:
  replicas: 0
  template:
    metadata:
      annotations:
        bluemap.guenter.cloud/addon-sha256: null
        bluemap.guenter.cloud/connectedglass-mode: null
    spec:
      containers:
        - name: minecraft
          env:
            - name: BLUEMAP_CONNECTEDGLASS_DISABLED_PROFILES
              $patch: delete
      initContainers:
        - name: install-local-artifacts
          args:
            - |
              addon=/data/config/bluemap/packs/bluemap-connectedglass-addon-0.1.0-alpha.1.jar
              connectedglass=/data/mods/connectedglass-1.1.14-neoforge-mc1.21.jar
              fusion=/data/mods/fusion-1.3.12-neoforge-mc1.21.1.jar
              rm -f -- "${addon}" \
                /data/config/bluemap/packs/zz-0246-connectedglass.zip \
                /data/config/bluemap/packs/zz-0049-fusion.zip
              rm -rf -- /data/bluemap/web/maps/connectedglass_staging
              test ! -e "${addon}"
              test ! -e /data/config/bluemap/packs/zz-0246-connectedglass.zip
              test ! -e /data/config/bluemap/packs/zz-0049-fusion.zip
              printf '%s  %s\n' \
                'e5b2a1cd8ef1b8a49a322aeccfc5cd9a53d8303613b9f30718f12a1e525d49fe' "${connectedglass}" \
                '17f5215648a98bcde4134577b013200dbf363273ae282449c51408ae8346f2fa' "${fusion}" \
                | sha256sum -c -
              printf 'CONNECTEDGLASS_ADDON_REMOVED\n'
